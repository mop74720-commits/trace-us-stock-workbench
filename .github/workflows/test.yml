name: TRACE tests

on:
  push:
    branches: [main, feat/unify-trace-intelligence-core]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: python -m pip install -r requirements.txt
      - run: node --test demo/logic.test.cjs demo/market.test.cjs demo/live-market.test.cjs demo/intelligence.test.cjs
      - run: python -m unittest discover -s demo -p test_server.py -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q trace demo/server.py
